name: Build Windows Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the Windows installer
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend and Electron integration
        run: npm run lint && npm run test:electron

      - name: Build unsigned Windows x64 installer
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Mission-Dashboard-*-windows-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $checksumPath = "dist/$($installer.BaseName).sha256.txt"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path $checksumPath -Encoding ascii

      - name: Upload installer to GitHub Release
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Mission-Dashboard-*-windows-x64.exe" | Select-Object -First 1
          $checksum = Get-ChildItem "dist/Mission-Dashboard-*-windows-x64.sha256.txt" | Select-Object -First 1
          if (-not $installer -or -not $checksum) { throw "Windows release files are incomplete." }
          $releaseTag = "${{ inputs.release_tag }}"
          if (-not $releaseTag) {
            $version = node -p "require('./package.json').version"
            $releaseTag = "v$version"
          }
          gh release upload $releaseTag `
            $installer.FullName `
            $checksum.FullName `
            --clobber `
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

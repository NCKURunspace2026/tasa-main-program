name: Build Windows Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or update
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build local FastAPI sidecar
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onedir --name mission-dashboard-backend --add-data "docs/scenarios:docs/scenarios" server_entry.py

      - name: Install dependencies
        run: npm ci

      - name: Check frontend and Electron integration
        run: npm run lint && npm run test:electron

      - name: Build unsigned Windows x64 installer
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Mission-Dashboard-*-windows-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $checksumPath = "dist/$($installer.BaseName).sha256.txt"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path $checksumPath -Encoding ascii

      - name: Upload installer and auto-update metadata to GitHub Release
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Mission-Dashboard-*-windows-x64.exe" | Select-Object -First 1
          $checksum = Get-ChildItem "dist/Mission-Dashboard-*-windows-x64.sha256.txt" | Select-Object -First 1
          $metadata = Get-Item "dist/latest.yml"
          $blockmap = Get-Item "$($installer.FullName).blockmap"
          if (-not $installer -or -not $checksum -or -not $metadata -or -not $blockmap) {
            throw "Windows release or auto-update files are incomplete."
          }
          $releaseTag = "${{ inputs.release_tag }}"
          if (-not $releaseTag) {
            $version = node -p "require('./package.json').version"
            $releaseTag = "v$version"
          }
          gh release view $releaseTag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --title "Mission Dashboard $releaseTag" --generate-notes --repo "${{ github.repository }}"
          }
          gh release upload $releaseTag `
            $installer.FullName `
            $checksum.FullName `
            $metadata.FullName `
            $blockmap.FullName `
            --clobber `
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
